[package]
name = "zinnia_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "_zinnia_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
# The halo2-base (Halo2-lib) backend: synthesizes and proves circuits in-process.
halo2-base-backend = ["halo2-base", "rand", "rayon"]
# The Noir backend: emits Noir source and runs nargo and bb. The Q32 fixed-point
# library in benchmarking/noir_fpc is embedded with include_str!, so the
# handwritten Noir baselines and the emitted programs share one source.
noir-backend = ["dep:base64", "dep:flate2", "dep:rmp-serde"]
extension-module = ["pyo3/extension-module"]

[dependencies]
base64 = { version = "0.22", optional = true }
flate2 = { version = "1", optional = true }
rmp-serde = { version = "1.3", optional = true }
pyo3 = { version = "0.23", features = ["auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pythonize = "0.23"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
# BN254 (`halo2curves::bn256::Fr`) and the `ff` field traits for the
# always-compiled core (witnesses, kernel, mock backend, preprocessing). This is
# the version halo2-base's halo2_proofs (PSE v0.3.0) uses, so the core and the
# halo2-base backend share one `Fr` type; `derive_serde` matches the features
# halo2_proofs requests.
halo2curves = { version = "0.6.1", features = ["derive_serde"] }
halo2-base = { git = "https://github.com/axiom-crypto/halo2-lib.git", branch = "community-edition", default-features = false, features = ["halo2-pse"], optional = true }
rand = { version = "0.8", optional = true }
# The thread pool halo2_proofs proves on; the halo2-base backend starts it
# before its timed `create_proof` window, as the handwritten halo2_hw baseline
# does.
rayon = { version = "1", optional = true }
# BLAKE2b for the canonical `ir_hash` (`ProofArtifact.ir_hash`), computed on
# the always-compiled prove path (`crate::prove::ir_hash`).
blake2b_simd = { version = "1.0" }
# Unbundled, so that builds do not compile libz3 from source: link a system
# libz3 or the one in the Python `z3-solver` wheel (`scripts/develop.sh` finds
# it and sets the linker search path and rpath).
z3 = "0.20"
# `debug!` / `info!` events; no subscriber is attached by default.
tracing = "0.1"

[dev-dependencies]
pyo3 = { version = "0.23", features = ["auto-initialize"] }

[build-dependencies]
pyo3-build-config = "0.23"

# Fat LTO and one codegen unit, as in the handwritten halo2 baselines, so the
# prove path is compiled the same way as the halo2_proofs code it is compared
# with. `panic` stays `unwind`: the Python harnesses catch Rust panics as
# per-program failures.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
