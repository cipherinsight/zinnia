# RISC Zero baselines: one host program for every case; `methods` builds the
# guest package for RISC Zero's RISC-V target. Profiles follow the RISC Zero
# project template.
[workspace]
members = ["host", "methods"]
resolver = "2"

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
