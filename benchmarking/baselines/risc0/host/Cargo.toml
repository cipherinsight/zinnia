[package]
name = "risc0-baseline"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
bincode = "1"
clap = { version = "4", features = ["derive"] }
ds1000-zkvm = { path = "../../zkvm_common/ds1000", features = ["std"] }
risc0-ds1000-methods = { path = "../methods" }
# `prove`: the prover runs in this process (no r0vm subprocess).
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["prove"] }
serde = "1"
serde_json = "1"
