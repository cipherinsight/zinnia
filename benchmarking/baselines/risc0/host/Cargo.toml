[package]
name = "risc0-baseline"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
bincode = "1"
clap = { version = "4", features = ["derive"] }
ds1000-zkvm = { path = "../../zkvm_common/ds1000", features = ["std"] }
risc0-ds1000-methods = { path = "../methods" }
# `prove`: the prover runs in this process (no r0vm subprocess).
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["prove"] }
serde = "1"
serde_json = "1"

# Pins only: the RISC Zero crates at the versions of the RISC Zero 3.0.3
# release (its Cargo.lock), the set r0vm 3.0.3 is built from. Newer
# semver-compatible ones do not build with risc0-zkvm 3.0.3's prover
# (risc0-circuit-rv32im 4.0.5 changed the SyscallContext trait).
risc0-binfmt = "=3.0.2"
risc0-circuit-keccak = "=4.0.2"
risc0-circuit-keccak-sys = "=4.0.1"
risc0-circuit-recursion = "=4.0.2"
risc0-circuit-recursion-sys = "=4.0.1"
risc0-circuit-rv32im = "=4.0.2"
risc0-circuit-rv32im-sys = "=4.0.1"
risc0-core = "=3.0.0"
risc0-groth16 = "=3.0.2"
risc0-sys = "=1.5.0"
risc0-zkos-v1compat = "=2.2.0"
risc0-zkp = "=3.0.2"
