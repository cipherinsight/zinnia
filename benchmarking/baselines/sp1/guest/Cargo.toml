[package]
name = "sp1-ds1000-guest"
version = "0.1.0"
edition = "2021"
publish = false

# One binary per case in src/bin/, generated by zkvm_common/sync_cases.py.
[dependencies]
ds1000-zkvm = { path = "../../zkvm_common/ds1000" }
sp1-zkvm = "=6.8.1"

# Built on its own for riscv64im-succinct-zkvm-elf.
[workspace]

# SP1's patched sha2 runs SHA-256 on SP1's precompile. sp1-zkvm hashes the
# committed public values with sha2, so without the patch every output byte
# pays for a software SHA-256 (SP1's documented practice for guests).
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
