[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "zinnia"
version = "0.0.1"
description = "A compiler for compiling Python code to low-level zero-knowledge circuit."
authors = [{name = "CipherInsight Ltd."}]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=2.2",
    "z3-solver>=4.13,<5",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "PyYAML>=6,<7",
]
benchmark = [
    "msgpack>=1.1,<2",
    "scipy>=1.15",
    "scikit-learn>=1.6",
]
dev = [
    "maturin>=1,<2",
    "pytest>=8.3,<9",
    "PyYAML>=6,<7",
    "scipy>=1.15",
    "scikit-learn>=1.6",
]

[tool.maturin]
module-name = "zinnia._zinnia_core"
python-source = "."

[tool.pytest.ini_options]
testpaths = ["testing"]
cache_dir = ".pytest_cache"
